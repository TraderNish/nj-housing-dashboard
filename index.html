<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>US Housing Prices — Zillow ZHVI by Zip</title>
<style>
  :root { --border:#dcdfe4; --head:#1f2933; --muted:#667085; }
  * { box-sizing: border-box; }
  body { font: 13px/1.4 -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
         margin: 0; color: #1f2933; background: #f7f8fa; }
  header { background: var(--head); color: #fff; padding: 14px 18px; }
  header h1 { margin: 0; font-size: 17px; }
  header .sub { color: #aeb6c2; font-size: 12px; margin-top: 3px; }
  .controls { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end;
              padding: 12px 18px; background: #fff; border-bottom: 1px solid var(--border);
              position: sticky; top: 0; z-index: 5; }
  .ctrl { display: flex; flex-direction: column; gap: 3px; }
  .ctrl label { font-size: 11px; color: var(--muted); text-transform: uppercase;
                letter-spacing: .03em; }
  .ctrl input[type=text], .ctrl select { padding: 5px 7px; border: 1px solid var(--border);
                border-radius: 5px; font-size: 13px; min-width: 150px; }
  .range { display: flex; align-items: center; gap: 6px; }
  .range input[type=range] { width: 120px; }
  .range .val { font-variant-numeric: tabular-nums; min-width: 92px; font-size: 12px; }
  .count { margin-left: auto; font-size: 13px; }
  .count b { font-size: 16px; }
  .tbl-wrap { overflow: auto; max-height: calc(100vh - 150px); margin: 0 18px 18px;
              border: 1px solid var(--border); border-radius: 6px; background: #fff; }
  table { border-collapse: collapse; width: max-content; min-width: 100%; }
  th, td { padding: 5px 8px; text-align: right; white-space: nowrap;
           border-bottom: 1px solid #eef0f3; }
  th { position: sticky; top: 0; background: #eef1f5; cursor: pointer; user-select: none;
       font-size: 11px; text-transform: uppercase; letter-spacing: .02em; z-index: 2; }
  th:hover { background: #e2e7ee; }
  th.sorted::after { content: " ▲"; color: #2563eb; }
  th.sorted.desc::after { content: " ▼"; }
  td.txt, th.txt { text-align: left; }
  /* sticky first 3 identity columns */
  .sticky-col { position: sticky; background: #fff; z-index: 1; }
  th.sticky-col { z-index: 3; background: #eef1f5; }
  .c0 { left: 0; }  .c1 { left: 58px; }  .c2 { left: 190px; }
  td.num { font-variant-numeric: tabular-nums; }
  td.null { color: #b0b6bf; }
  .monthly { background: #fcfcfd; color: #475467; }
  .mhead { background: #e8ecf1 !important; }
  .toggle-m { cursor: pointer; color: #2563eb; font-size: 12px; }
  .legend { font-size: 11px; color: var(--muted); padding: 6px 18px; }
  .legend span { display: inline-block; width: 12px; height: 12px; border-radius: 2px;
                 vertical-align: -2px; margin: 0 3px; }
</style>
</head>
<body>
<header>
  <h1>US Housing Prices — Zillow ZHVI by Zip Code</h1>
  <div class="sub" id="subtitle">loading…</div>
</header>

<div class="controls">
  <div class="ctrl">
    <label>Search zip / city</label>
    <input type="text" id="q" placeholder="e.g. 07030 or Hoboken">
  </div>
  <div class="ctrl">
    <label>State</label>
    <select id="stateSel"><option value="">All states</option></select>
  </div>
  <div class="ctrl">
    <label>County</label>
    <select id="county"><option value="">All counties</option></select>
  </div>
  <div class="ctrl">
    <label>Latest price min / max</label>
    <div class="range">
      <input type="range" id="priceMin"><input type="range" id="priceMax">
      <span class="val" id="priceVal"></span>
    </div>
  </div>
  <div class="ctrl">
    <label>1-yr change % min / max</label>
    <div class="range">
      <input type="range" id="y1Min"><input type="range" id="y1Max">
      <span class="val" id="y1Val"></span>
    </div>
  </div>
  <div class="count">Showing <b id="rowcount">0</b> zips</div>
</div>
<div class="legend">
  Change cells: <span style="background:#34a853"></span> gain
  <span style="background:#ea4335"></span> loss — intensity scales with magnitude.
  <a class="toggle-m" id="toggleM">Show 60 monthly columns ▸</a>
</div>

<div class="tbl-wrap">
  <table id="tbl">
    <thead><tr id="headrow"></tr></thead>
    <tbody id="body"></tbody>
  </table>
</div>

<script src="data.js"></script>
<script>
const D = window.__HOUSING__;
const fmtUSD = n => n == null ? "—" : "$" + n.toLocaleString("en-US");
const fmtPct = n => n == null ? "—" : (n > 0 ? "+" : "") + n.toFixed(1) + "%";

// ---- column definitions ----
const CHG = [["m1","1mo"],["m3","3mo"],["m6","6mo"],["y1","1yr"],["y3","3yr"],["y5","5yr"]];
const baseCols = [
  {key:"zip",    label:"Zip",    txt:true,  sticky:"c0", get:r=>r.zip},
  {key:"city",   label:"City",   txt:true,  sticky:"c1", get:r=>r.city||""},
  {key:"county", label:"County", txt:true,  sticky:"c2", get:r=>r.county||""},
  {key:"state",  label:"State",  txt:true,  get:r=>r.state||""},
  {key:"latest", label:"Latest", num:true,  get:r=>r.latest, fmt:fmtUSD},
];
CHG.forEach(([k,lbl]) => baseCols.push(
  {key:k, label:lbl, num:true, chg:true, get:r=>r.changes[k], fmt:fmtPct}));
const monthCols = D.monthCols.map((m, i) => ({
  key:m, label:m.slice(0,7), num:true, monthly:true,
  get:r=>r.months[i], fmt:fmtUSD}));

let showMonthly = false;
let sortKey = "latest", sortDesc = true;

// ---- color scale for change cells ----
const CLAMP = 25; // % magnitude mapped to full saturation
function chgColor(v){
  if (v == null) return "";
  const a = Math.min(Math.abs(v)/CLAMP, 1) * 0.85 + 0.05;
  return v >= 0 ? `background:rgba(52,168,83,${a.toFixed(3)})`
               : `background:rgba(234,67,53,${a.toFixed(3)})`;
}

// ---- filter state, seeded from data extents ----
const prices = D.rows.map(r=>r.latest);
const y1s = D.rows.map(r=>r.changes.y1).filter(v=>v!=null);
const P = {lo: Math.min(...prices), hi: Math.max(...prices)};
const Y = {lo: Math.floor(Math.min(...y1s)), hi: Math.ceil(Math.max(...y1s))};

function setupRange(minEl, maxEl, lo, hi, step){
  [minEl,maxEl].forEach(e=>{e.min=lo; e.max=hi; e.step=step;});
  minEl.value=lo; maxEl.value=hi;
}
setupRange(priceMin, priceMax, P.lo, P.hi, 1000);
setupRange(y1Min, y1Max, Y.lo, Y.hi, 0.1);

// state dropdown, default to NJ
const stateSel = document.getElementById("stateSel");
D.states.forEach(s => stateSel.add(new Option(s, s)));
stateSel.value = D.defaultState && D.states.includes(D.defaultState) ? D.defaultState : "";

// county dropdown depends on the selected state (counties repeat across states)
function populateCounties(){
  const st = stateSel.value;
  const cs = [...new Set(D.rows
    .filter(r => !st || r.state === st)
    .map(r => r.county).filter(Boolean))].sort();
  county.length = 1;                       // keep the "All counties" option
  cs.forEach(c => county.add(new Option(c, c)));
}
populateCounties();

// ---- build header ----
function buildHead(){
  const cols = showMonthly ? baseCols.concat(monthCols) : baseCols;
  headrow.innerHTML = "";
  cols.forEach(c=>{
    const th = document.createElement("th");
    th.textContent = c.label;
    if (c.txt) th.classList.add("txt");
    if (c.sticky) th.classList.add("sticky-col", c.sticky);
    if (c.monthly) th.classList.add("mhead");
    if (c.key === sortKey){ th.classList.add("sorted"); if (sortDesc) th.classList.add("desc"); }
    th.onclick = ()=>{
      if (sortKey === c.key) sortDesc = !sortDesc;
      else { sortKey = c.key; sortDesc = c.num; } // numbers default high->low, text a->z
      render();
    };
    headrow.appendChild(th);
  });
}

// ---- filtering ----
function passes(r){
  const q = document.getElementById("q").value.trim().toLowerCase();
  if (q && !(r.zip.toLowerCase().includes(q) ||
             (r.city||"").toLowerCase().includes(q))) return false;
  if (stateSel.value && r.state !== stateSel.value) return false;
  if (county.value && r.county !== county.value) return false;
  if (r.latest < +priceMin.value || r.latest > +priceMax.value) return false;
  const y1 = r.changes.y1;
  const yLoActive = +y1Min.value > Y.lo, yHiActive = +y1Max.value < Y.hi;
  if (y1 == null){ if (yLoActive || yHiActive) return false; }
  else if (y1 < +y1Min.value || y1 > +y1Max.value) return false;
  return true;
}

// ---- render ----
function render(){
  // keep min<=max on the dual sliders
  if (+priceMin.value > +priceMax.value) [priceMin.value, priceMax.value]=[priceMax.value, priceMin.value];
  if (+y1Min.value > +y1Max.value) [y1Min.value, y1Max.value]=[y1Max.value, y1Min.value];
  priceVal.textContent = `${fmtUSD(+priceMin.value)} – ${fmtUSD(+priceMax.value)}`;
  y1Val.textContent = `${(+y1Min.value).toFixed(1)} – ${(+y1Max.value).toFixed(1)}%`;

  buildHead();
  const cols = showMonthly ? baseCols.concat(monthCols) : baseCols;
  const col = baseCols.concat(monthCols).find(c=>c.key===sortKey) || baseCols[3];

  const rows = D.rows.filter(passes).sort((a,b)=>{
    let x = col.get(a), y = col.get(b);
    const xn = x==null||x==="", yn = y==null||y==="";
    if (xn && yn) return 0;
    if (xn) return 1;            // nulls/blanks always sort last
    if (yn) return -1;
    if (col.num) return sortDesc ? y-x : x-y;
    x=(""+x).toLowerCase(); y=(""+y).toLowerCase();
    return sortDesc ? (x<y?1:x>y?-1:0) : (x>y?1:x<y?-1:0);
  });

  const html = rows.map(r=>{
    let tds = cols.map(c=>{
      const v = c.get(r);
      let cls = c.txt ? "txt" : "num";
      if (c.sticky) cls += " sticky-col " + c.sticky;
      if (c.monthly) cls += " monthly";
      if (c.chg && v==null) cls += " null";
      const style = c.chg ? chgColor(v) : "";
      const text = c.fmt ? c.fmt(v) : (v==null?"—":v);
      return `<td class="${cls}"${style?` style="${style}"`:""}>${text}</td>`;
    }).join("");
    return `<tr>${tds}</tr>`;
  }).join("");

  document.getElementById("body").innerHTML = html;
  document.getElementById("rowcount").textContent = rows.length.toLocaleString();
}

// ---- wire up ----
["q","county","priceMin","priceMax","y1Min","y1Max"].forEach(id=>{
  const el = document.getElementById(id);
  el.addEventListener("input", render);
});
// changing state resets the county list to that state's counties
stateSel.addEventListener("input", ()=>{ populateCounties(); county.value=""; render(); });
document.getElementById("toggleM").onclick = e=>{
  showMonthly = !showMonthly;
  e.target.textContent = showMonthly ? "Hide monthly columns ▾" : "Show 60 monthly columns ▸";
  render();
};
document.getElementById("subtitle").textContent =
  `${D.count.toLocaleString()} zips · ${D.states.length} states · `
  + `${D.monthCols.length} months (${D.monthCols[0].slice(0,7)} → `
  + `${D.latestMonth.slice(0,7)}) · source: Zillow ZHVI (smoothed, seasonally adjusted)`;

render();
</script>
</body>
</html>
